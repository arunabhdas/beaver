name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64 Linux
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-24.04-arm     # aarch64 Linux
            cc: gcc
          - os: macos-latest         # Apple silicon
            cc: clang
          - os: macos-13             # Intel macOS
            cc: clang
    env:
      BEAVER_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang
        if: runner.os == 'Linux' && matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --locked
      - name: Smoke test the release binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/beaver"
          cd "$RUNNER_TEMP"
          "$BIN" --version
          "$BIN" new demo
          cd demo
          test "$("$BIN" run 2>/dev/null)" = "Hello, Beaver!"
          "$BIN" test
          "$BIN" build --release
          ./target/release/demo
