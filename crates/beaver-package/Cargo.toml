[package]
name = "beaver-package"
description = "Beaver manifests, lockfiles, registry client, archives and dependency resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
beaver-source.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
toml = "=0.9.12"
toml_edit = "=0.25.15"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.9"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
