[package]
name = "beaver-cli"
description = "The `beaver` command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "beaver"
path = "src/main.rs"

[dependencies]
beaver-source.workspace = true
beaver-syntax.workspace = true
beaver-sema.workspace = true
beaver-mir.workspace = true
beaver-codegen-c.workspace = true
beaver-package.workspace = true
clap = { version = "=4.6.5", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"
flate2 = "=1.1.9"
tar = { version = "=0.4.46", default-features = false }
sha2 = "=0.10.9"
